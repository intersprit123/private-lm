name: Build PrivateLM Connection Tester

on:
  workflow_dispatch:
  push:
    branches: [windows]
    paths:
      - "connection_test/**"
      - ".github/workflows/build-connection-tester.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PrivateLM-Connection-Tester connection_test/privatelm_connection_tester.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-Connection-Tester-Windows-x64
          path: dist/PrivateLM-Connection-Tester.exe
          if-no-files-found: error
