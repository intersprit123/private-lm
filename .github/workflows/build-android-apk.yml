name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "local_plugins/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".gitmodules"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true

      - name: Fetch Stable Diffusion native source
        run: |
          SD_CPP_DIR=local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp
          SD_CPP_COMMIT=22c8c40b0dae37fd4fbf1810f145ce2f7762d088
          mkdir -p "$(dirname "$SD_CPP_DIR")"
          if [ ! -d "$SD_CPP_DIR/.git" ]; then
            git clone --filter=blob:none --no-checkout https://github.com/leejet/stable-diffusion.cpp.git "$SD_CPP_DIR"
          fi
          # Pin to the C API used by this plugin's existing sd_jni_wrapper.cpp.
          # Newer upstream revisions changed the API and no longer compile this wrapper.
          git -C "$SD_CPP_DIR" fetch --depth 1 origin "$SD_CPP_COMMIT"
          git -C "$SD_CPP_DIR" checkout --detach "$SD_CPP_COMMIT"
          # The pinned stable-diffusion.cpp revision has ggml as a nested submodule.
          git -C "$SD_CPP_DIR" submodule sync -- ggml
          git -C "$SD_CPP_DIR" submodule update --init --depth 1 ggml

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-Android-Test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
