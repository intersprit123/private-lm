name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "local_plugins/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".gitmodules"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          cache: true

      - name: Fetch Stable Diffusion native source
        run: |
          mkdir -p local_plugins/sd_flutter_android/android/src/main/cpp
          if [ ! -d local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp/.git ]; then
            git clone --depth 1 https://github.com/leejet/stable-diffusion.cpp.git local_plugins/sd_flutter_android/android/src/main/cpp/stable-diffusion.cpp
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-Android-Test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
