name: Windows Host EXE
on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Compile Python launcher
        run: python -m py_compile windows_host/privatelm_windows_host.py
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PrivateLM-Windows-Host windows_host/privatelm_windows_host.py
      - name: Upload Windows host EXE
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-Windows-Host-${{ github.sha }}
          path: dist/PrivateLM-Windows-Host.exe
          if-no-files-found: error
          retention-days: 14
