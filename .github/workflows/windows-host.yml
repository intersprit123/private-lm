name: PrivateLM Windows Host EXE
on:
  push:
    branches: [windows, feature/device-cluster-foundation]
  pull_request:
    branches: [windows, feature/device-cluster-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows_host/requirements-build.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r windows_host/requirements-build.txt
      - name: Compile Python modules
        run: python -m compileall -q windows_host tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --paths windows_host --hidden-import cluster_config --hidden-import cluster_protocol --hidden-import hardware --collect-all cryptography --collect-all qrcode --collect-all PIL --name PrivateLM-Windows-Host windows_host/privatelm_windows_host.py
      - name: Upload Windows host EXE
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-Windows-Host-feature-device-cluster-foundation
          path: dist/PrivateLM-Windows-Host.exe
          if-no-files-found: error
          retention-days: 14
